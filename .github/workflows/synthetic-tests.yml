name: Synthetic UEOT Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run synthetic unit tests and preserve evidence
        shell: bash
        run: |
          mkdir -p evidence
          {
            git rev-parse HEAD
            python --version
            uname -a
            date -u
            git ls-files runtime tests | xargs sha256sum
          } > evidence/environment.txt
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee evidence/unittest.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > evidence/exit-code.txt
          exit "$rc"
      - name: Archive raw regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ueot-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
