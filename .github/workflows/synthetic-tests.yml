name: Synthetic UEOT Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run synthetic unit tests
        run: python -m unittest discover -s tests -v
